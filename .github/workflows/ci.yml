name: web-sdk-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-sdk-checks
          path: |
            .artifacts/*.tgz
            .artifacts/pack-report.json
            test-results/
          if-no-files-found: ignore
